# App Store の審査状況を読むだけ（書き込みはしない）。鍵は GitHub Secrets の中だけで使う
name: App Store status
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - run: pip install -q "pyjwt[crypto]" requests
      - name: Read review status
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        shell: python
        run: |
          import os, time, json, jwt, requests, re
          # 鍵の形だけを点検（値そのものは出さない）
          kid, iss, p8 = os.environ["ASC_KEY_ID"].strip(), os.environ["ASC_ISSUER_ID"].strip(), os.environ["ASC_KEY_P8"]
          print("CHECK key_id_len=%d key_id_alnum=%s issuer_is_uuid=%s p8_begin=%s p8_end=%s p8_lines=%d" % (len(kid), kid.isalnum(),
                bool(re.fullmatch(r"[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}", iss)),
                "BEGIN PRIVATE KEY" in p8, "END PRIVATE KEY" in p8, len(p8.strip().splitlines())))
          os.environ["ASC_KEY_ID"], os.environ["ASC_ISSUER_ID"] = kid, iss
          now = int(time.time())
          tok = jwt.encode({"iss": os.environ["ASC_ISSUER_ID"], "iat": now, "exp": now + 600, "aud": "appstoreconnect-v1"},
                           os.environ["ASC_KEY_P8"], algorithm="ES256", headers={"kid": os.environ["ASC_KEY_ID"], "typ": "JWT"})
          H = {"Authorization": "Bearer " + tok}
          B = "https://api.appstoreconnect.apple.com/v1"
          r0 = requests.get(B + "/apps", params={"filter[bundleId]": "com.himori.jintori"}, headers=H, timeout=30)
          if r0.status_code == 401:  # 個人キー（チームキーでない）なら iss の代わりに sub=user で通る
              t2 = jwt.encode({"sub": "user", "iat": now, "exp": now + 600, "aud": "appstoreconnect-v1"}, os.environ["ASC_KEY_P8"], algorithm="ES256", headers={"kid": os.environ["ASC_KEY_ID"], "typ": "JWT"})
              print("INDIVIDUAL_KEY_TRY status=%d" % requests.get(B + "/apps", params={"filter[bundleId]": "com.himori.jintori"}, headers={"Authorization": "Bearer " + t2}, timeout=30).status_code)
          if r0.status_code != 200:
              print("API_ERROR status=%d %s" % (r0.status_code, json.dumps([{k: e.get(k) for k in ("status", "code", "title", "detail")} for e in r0.json().get("errors", [])], ensure_ascii=False)))
              raise SystemExit(1)
          app = r0.json()["data"][0]
          print("APP_APPLE_ID=" + app["id"])
          vs = requests.get(B + "/apps/" + app["id"] + "/appStoreVersions",
                            params={"fields[appStoreVersions]": "versionString,appStoreState,createdDate", "limit": 5}, headers=H, timeout=30).json()["data"]
          for v in vs:
              a = v["attributes"]; print("VERSION=%s STATE=%s" % (a["versionString"], a["appStoreState"]))
          bs = requests.get(B + "/builds", params={"filter[app]": app["id"], "sort": "-uploadedDate", "limit": 3,
                            "fields[builds]": "version,processingState,uploadedDate"}, headers=H, timeout=30).json()["data"]
          for b in bs:
              a = b["attributes"]; print("BUILD=%s PROCESSING=%s" % (a["version"], a["processingState"]))
          sub = requests.get(B + "/reviewSubmissions", params={"filter[app]": app["id"], "limit": 1}, headers=H, timeout=30).json().get("data", [])
          for x in sub: print("SUBMISSION=%s %s" % (x["attributes"]["state"], x["attributes"]["submittedDate"]))
          infos = requests.get(B + "/apps/" + app["id"] + "/appInfos", headers=H, timeout=30).json().get("data", [])
          for inf in infos[:2]:
              ar = requests.get(B + "/appInfos/" + inf["id"] + "/ageRatingDeclaration", headers=H, timeout=30).json().get("data")
              if ar: print("AGE_RATING=%s %s" % (inf["attributes"].get("appStoreState"), json.dumps(ar["attributes"], ensure_ascii=False)))
